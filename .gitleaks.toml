# gitleaks configuration: default rules plus project-specific ones.
title = "minecraft-claude-platform"

[extend]
useDefault = true

[[rules]]
id = "claude-oauth-token"
description = "Claude Code OAuth token"
regex = '''sk-ant-oat\d{2}-[A-Za-z0-9_\-]{20,}'''
tags = ["anthropic"]

[[rules]]
id = "assigned-secret-in-env"
description = "Non-empty secret assigned in an env-style file"
regex = '''(?i)(RCON_PASSWORD|GATEWAY_MOD_TOKEN|ANTHROPIC_API_KEY|CLAUDE_CODE_OAUTH_TOKEN)[ \t]*[=:][ \t]*["']?[A-Za-z0-9_\-\.]{12,}'''
tags = ["config"]
