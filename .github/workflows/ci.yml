name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config .gitleaks.toml --redact --verbose /repo

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  docs-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lychee (offline, repo-internal links)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (warnings and errors)
        run: >
          docker run --rm -v "$PWD:/mnt" -w /mnt
          koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          -S warning scripts/*.sh tests/operational/*.sh containers/management/mcai-server

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: pytest (wizard, compose security, restore safety, AI core, gateway/worker integration with mock AI)
        run: pytest

  atlantis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Generator tests (each file in its own process)
        env:
          ATLANTIS_TIME_FACTOR: "6"     # timing limits are for an idle machine; runners are shared and slower
        run: python3 examples/atlantis/generator/tests/run_all.py -j 4
      - name: Catalog hashes match the generator source (Atlantis Lite rebuilt)
        run: scripts/build-examples.sh --check

  mod-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build + unit-test the Fabric mod (pinned Gradle/JDK 25 container, -Werror)
        run: scripts/build-mod.sh
      - name: mod tests report
        run: grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' minecraft-mod/build/test-results/test/*.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-jar
          path: dist/mod/*.jar
          if-no-files-found: error
          retention-days: 7

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ruff (errors, undefined names, unused code; see ruff.toml)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/astral-sh/ruff@sha256:c4b7e7a87e4b07d66b569dd2e6b2ce5a25e38be91dd664dc49b9882be27acd9b
          check --output-format github

  images:
    runs-on: ubuntu-24.04
    env:
      TRIVY: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # 0.76.1
      SYFT: anchore/syft@sha256:3c70e6d5979364cefdc22b51617a78fd264574d3bd6b4f84a351204147025e2a # v1.57.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build for linux/amd64 and linux/arm64
        run: |
          for spec in gateway:containers/gateway/Dockerfile ai-worker:containers/claude/Dockerfile \
                      ssh-gateway:containers/management/Dockerfile; do
            docker buildx build --platform linux/amd64,linux/arm64 -f "${spec#*:}" -t "mcai-${spec%%:*}:multiarch" .
          done
      - name: build gateway, ai-worker and ssh-gateway images (amd64, loaded for the checks below)
        run: |
          docker buildx build --load -f containers/gateway/Dockerfile -t mcai-gateway:ci .
          docker buildx build --load -f containers/claude/Dockerfile -t mcai-ai-worker:ci .
          docker run --rm --entrypoint claude mcai-ai-worker:ci --version
          docker run --rm --entrypoint id mcai-ai-worker:ci -u | grep -qv '^0$'
          docker run --rm --entrypoint sh mcai-ai-worker:ci -c '! command -v npm'
          docker run --rm --entrypoint id mcai-gateway:ci -u | grep -qv '^0$'
          docker buildx build --load -f containers/management/Dockerfile --build-arg PUID=1001 --build-arg PGID=1001 -t mcai-ssh-gateway:ci .
          docker run --rm --entrypoint id mcai-ssh-gateway:ci -u | grep -qx 1001
          docker run --rm --entrypoint /usr/sbin/sshd mcai-ssh-gateway:ci -t -f /etc/mcai/sshd_config 2>&1 | grep -q 'no hostkeys' || true
      - name: Trivy - images (fails on HIGH/CRITICAL with a fix available)
        run: |
          for img in mcai-gateway:ci mcai-ai-worker:ci mcai-ssh-gateway:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
              "$TRIVY" image --skip-version-check --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done
      - name: Trivy - Dockerfiles and compose (fails on HIGH/CRITICAL)
        run: >
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/trivy:/root/.cache/trivy"
          "$TRIVY" config --skip-version-check --severity HIGH,CRITICAL --exit-code 1 /repo
      - name: SBOMs (SPDX JSON)
        run: |
          mkdir -p sbom
          for img in gateway ai-worker ssh-gateway; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT" \
              "docker:mcai-$img:ci" -o spdx-json > "sbom/mcai-$img.spdx.json"
          done
          ls -l sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  operational:
    # Full first-start / AI / SSH / automations / Atlantis / backup / restore / crash-recovery cycle (~15 min).
    # Runs on main and on demand, not on every PR.
    if: github.event_name != 'pull_request'
    needs: [unit-tests, shellcheck, mod-build, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reuse the jar from mod-build (fewer Maven Central downloads; the wizard skips the build when a jar exists).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-jar
          path: dist/mod
      - name: first start, /ai round trip, isolation, backup, restore, crash recovery
        run: tests/operational/first_start.sh "$RUNNER_TEMP/optest"
      - name: keep the server's crash reports and logs when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operational-server-logs
          path: |
            ${{ runner.temp }}/optest/data/minecraft/crash-reports/
            ${{ runner.temp }}/optest/data/minecraft/logs/
          if-no-files-found: ignore
          retention-days: 7
