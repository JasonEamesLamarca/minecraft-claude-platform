name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove secrets, real IPs/hostnames and player names from logs before posting."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Platform version / commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Host OS, CPU arch, Docker version, Minecraft version, AI auth method (API key / subscription; never the value)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      render: text
