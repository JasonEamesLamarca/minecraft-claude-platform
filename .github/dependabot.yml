version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/containers/gateway", "/containers/claude"]
    schedule:
      interval: weekly
    # Base images: digest/patch updates only. Python/Node version upgrades are deliberate changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: gradle
    directory: /minecraft-mod
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
# Not covered by Dependabot (update by hand, see docs/development/README.md): the Claude Code version
# (ARG CLAUDE_CODE_VERSION in containers/claude/Dockerfile) and the Gradle image digest in scripts/build-mod.sh.
