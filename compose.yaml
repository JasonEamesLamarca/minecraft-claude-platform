# Minecraft AI Platform - Docker Compose deployment.
# Run scripts/setup.sh first: it creates .env and secrets/ (both git-ignored), asks you to accept the
# Minecraft EULA, and validates this file. Then: docker compose up -d
#
# Images are pinned by tag AND digest (multi-arch: amd64 + arm64). Dependabot proposes updates.
# Services added in later phases (gateway, ai-worker, automation, management, ssh-gateway) join the
# `internal` network; only the game port (and later the SSH gateway port) is published.

name: ${COMPOSE_PROJECT_NAME:-mcai}

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  minecraft:
    <<: *hardening
    image: itzg/minecraft-server:2026.10.1-java21@sha256:07ab333a8542208c4c863a78fd3cf3fd1138d5a2e118306e1a316d202f69ab74
    # Runs as the installing user's UID/GID (written to .env by setup.sh), never as root.
    user: "${PUID:?Run scripts/setup.sh first}:${PGID:?Run scripts/setup.sh first}"
    restart: unless-stopped
    stop_grace_period: 2m
    read_only: true
    tmpfs:
      - /tmp:size=256m
    environment:
      # setup.sh only sets TRUE after you explicitly accept https://www.minecraft.net/eula
      EULA: "${MC_EULA:?Run scripts/setup.sh first}"
      TYPE: "${MC_TYPE:-FABRIC}"
      VERSION: "${MC_VERSION:-1.21.1}"
      FABRIC_LOADER_VERSION: "${MC_FABRIC_LOADER_VERSION:-0.20.1}"
      # Server mods from Modrinth, "project:versionId" pins an exact build.
      MODRINTH_PROJECTS: "${MC_MODS:-fabric-api:Mys3P7lK}"
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      # Remove older copies of the platform mod before /mods is copied in (upgrades), and nothing else.
      REMOVE_OLD_MODS: "true"
      REMOVE_OLD_MODS_INCLUDE: "mcai-fabric-*.jar"
      MEMORY: "${MC_MEMORY:-4G}"
      JVM_XX_OPTS: "${MC_JVM_XX_OPTS:--XX:+UseZGC -XX:+ZGenerational}"
      TZ: "${TZ:-UTC}"
      MOTD: "${MC_MOTD:-Minecraft AI Platform}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-10}"
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-10}"
      LEVEL: "${MC_LEVEL:-world}"
      # Security defaults: real Minecraft accounts only, whitelist enforced, owner is the only op.
      ONLINE_MODE: "${MC_ONLINE_MODE:-true}"
      ENFORCE_SECURE_PROFILE: "true"
      ENABLE_WHITELIST: "${MC_WHITELIST:-true}"
      ENFORCE_WHITELIST: "${MC_WHITELIST:-true}"
      WHITELIST: "${MC_OWNER:?Run scripts/setup.sh first}"
      OPS: "${MC_OWNER}"
      # Whitelist: owner is (re-)added at start; players added in-game are kept.
      EXISTING_WHITELIST_FILE: MERGE
      # Ops: reset to exactly the owner at every start, so op rights granted in-game do not persist.
      EXISTING_OPS_FILE: SYNCHRONIZE
      # RCON: internal network only (never published), password from a Docker secret.
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      CREATE_CONSOLE_IN_PIPE: "false"
      ENABLE_AUTOPAUSE: "false"
      STOP_SERVER_ANNOUNCE_DELAY: "10"
      # mcai server mod (copied from /mods into /data/mods at start): /ai commands -> gateway
      MCAI_GATEWAY_URL: http://gateway:8080
      MCAI_GATEWAY_TOKEN_FILE: /run/secrets/gateway_mod_token
      MCAI_COMMAND: "${MCAI_COMMAND:-ai}"
      MCAI_ASK_PERMISSION_LEVEL: "${MCAI_ASK_PERMISSION_LEVEL:-0}"
      MCAI_ALLOW_CONSOLE: "${MCAI_ALLOW_CONSOLE:-true}"
      MCAI_BLOCKS_PER_TICK: "${MCAI_BLOCKS_PER_TICK:-2000}"
    secrets:
      - rcon_password
      - gateway_mod_token
    ports:
      - "${MC_BIND_ADDRESS:-0.0.0.0}:${MC_PORT:-25565}:25565"
    networks:
      - edge
      - internal
    volumes:
      - "${MC_DATA_DIR:-./data/minecraft}:/data"
      - "${MCAI_MOD_DIR:-./dist/mod}:/mods:ro"
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: "${MC_MEM_LIMIT:-5g}"
    cpus: "${MC_CPUS:-2.0}"
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "mc-health"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3

  backup:
    <<: *hardening
    image: itzg/mc-backup:2026.10.3@sha256:f86cf8466e203ebffaef2c020de35aaafbab18327ce0d3f63253f1b000d131d6
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      RCON_HOST: minecraft
      RCON_PORT: "25575"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      SERVER_HOST: minecraft
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
      INITIAL_DELAY: "${BACKUP_INITIAL_DELAY:-10m}"
      PRUNE_BACKUPS_DAYS: "${BACKUP_PRUNE_DAYS:-14}"
      PAUSE_IF_NO_PLAYERS: "${BACKUP_PAUSE_IF_NO_PLAYERS:-true}"
      BACKUP_NAME: "${MC_LEVEL:-world}"
      # Mods are re-downloaded at start; the RCON client files hold the RCON password.
      EXCLUDES: "*.jar,cache,logs,*.tmp,.rcon-cli.env,.rcon-cli.yaml"
      TZ: "${TZ:-UTC}"
    secrets:
      - rcon_password
    networks:
      - internal
    volumes:
      - "${MC_DATA_DIR:-./data/minecraft}:/data:ro"
      - "${BACKUP_DIR:-./backups}:/backups"
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128

  gateway:
    <<: *hardening
    build:
      context: .
      dockerfile: containers/gateway/Dockerfile
    image: mcai-gateway:${MCAI_VERSION:-dev}
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GATEWAY_DATA_DIR: /data
      GATEWAY_MOD_TOKEN_FILE: /run/secrets/gateway_mod_token
      GATEWAY_WORKER_TOKEN_FILE: /run/secrets/worker_token
      AI_MAX_PROMPT_CHARS: "${AI_MAX_PROMPT_CHARS:-500}"
      AI_MAX_REPLY_CHARS: "${AI_MAX_REPLY_CHARS:-1200}"
      AI_PLAYER_REQUESTS_PER_MINUTE: "${AI_PLAYER_REQUESTS_PER_MINUTE:-3}"
      AI_MAX_PENDING_PER_PLAYER: "${AI_MAX_PENDING_PER_PLAYER:-1}"
      AI_MAX_QUEUE: "${AI_MAX_QUEUE:-20}"
      AI_DAILY_BUDGET_USD: "${AI_DAILY_BUDGET_USD:-2.00}"
      AI_REQUEST_TIMEOUT_SECONDS: "${AI_REQUEST_TIMEOUT_SECONDS:-180}"
      AUDIT_LOG_TEXT: "${AUDIT_LOG_TEXT:-false}"
      AI_BUILD_MIN_OP_LEVEL: "${AI_BUILD_MIN_OP_LEVEL:-4}"
      AI_BUILD_TIMEOUT_SECONDS: "${AI_BUILD_TIMEOUT_SECONDS:-420}"
      AI_APPROVE_TTL_SECONDS: "${AI_APPROVE_TTL_SECONDS:-900}"
      AI_BUILD_MAX_BLOCKS: "${AI_BUILD_MAX_BLOCKS:-40000}"
      AI_BUILD_MAX_X: "${AI_BUILD_MAX_X:-48}"
      AI_BUILD_MAX_Y: "${AI_BUILD_MAX_Y:-64}"
      AI_BUILD_MAX_Z: "${AI_BUILD_MAX_Z:-48}"
      AI_BUILD_MAX_DISTANCE: "${AI_BUILD_MAX_DISTANCE:-64}"
    secrets:
      - gateway_mod_token
      - worker_token
    networks:
      - internal
    volumes:
      - "${GATEWAY_DATA_DIR:-./data/gateway}:/data"
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128

  # Holds the AI credential; no world data, no Docker socket, no published ports.
  ai-worker:
    <<: *hardening
    build:
      context: .
      dockerfile: containers/claude/Dockerfile
    image: mcai-ai-worker:${MCAI_VERSION:-dev}
    # Same UID as the installing user: secret files are mode 600 and owned by that user.
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=${PUID},gid=${PGID},mode=0700
      - /home/worker:size=128m,uid=${PUID},gid=${PGID},mode=0700
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_URL: http://gateway:8080
      WORKER_TOKEN_FILE: /run/secrets/worker_token
      AI_PROVIDER: "${AI_PROVIDER:-claude}"
      AI_AUTH_METHOD: "${AI_AUTH_METHOD:-none}"
      AI_CREDENTIAL_FILE: /run/secrets/ai_credential
      AI_MODEL: "${AI_MODEL:-}"
      AI_MAX_REQUEST_USD: "${AI_MAX_REQUEST_USD:-0.25}"
      AI_MAX_BUILD_USD: "${AI_MAX_BUILD_USD:-1.00}"
      AI_BUILD_MAX_TURNS: "${AI_BUILD_MAX_TURNS:-10}"
      AI_MAX_CONCURRENT_JOBS: "${AI_MAX_CONCURRENT_JOBS:-2}"
      MC_VERSION: "${MC_VERSION:-1.21.1}"
      TZ: "${TZ:-UTC}"
    secrets:
      - worker_token
      - ai_credential
    networks:
      - internal
      - ai-egress
    mem_limit: "${AI_WORKER_MEM_LIMIT:-1g}"
    cpus: "1.0"
    pids_limit: 256

networks:
  # Published game port + outbound internet (Mojang auth, mod downloads).
  edge: {}
  # Service-to-service traffic only; no route to the outside world.
  internal:
    internal: true
  # Outbound internet for the AI worker only (AI provider API).
  ai-egress: {}

secrets:
  rcon_password:
    file: ./secrets/rcon_password
  gateway_mod_token:
    file: ./secrets/gateway_mod_token
  worker_token:
    file: ./secrets/worker_token
  ai_credential:
    file: ./secrets/ai_credential
