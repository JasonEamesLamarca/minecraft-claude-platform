repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: private-denylist
        name: private identifier deny-list (local file, never committed)
        entry: scripts/check-private.sh
        language: script
        pass_filenames: false
