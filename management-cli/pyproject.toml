[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcai-cli"
version = "0.4.0"
description = "Administer a Minecraft AI Platform server over SSH"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.80"]

[project.scripts]
mcai = "mcai_cli:main"

[tool.setuptools]
py-modules = ["mcai_cli"]
