# Asks the AI for a short building challenge once a day. Costs a few cents at most (limits below).
id = "daily-ai-challenge"
name = "Daily AI building challenge"
description = "At 19:00 the AI invents a small building challenge and announces it."
timezone = "Europe/Berlin"
enabled = false

[trigger]
schedule = "0 19 * * *"

[conditions]
players_online_min = 1
days = ["fri", "sat", "sun"]

[[actions]]
type = "ai_message"
prompt = "Invent one short, fun building challenge for the players online today ({date}). One or two sentences, survival-friendly, no rewards promised."
to = "broadcast"
max_usd = 0.05

[limits]
timeout_s = 150
retries = 1
retry_delay_s = 60
ai_max_usd_per_day = 0.10
ai_max_tokens_per_day = 20000
max_runs_per_hour = 1
